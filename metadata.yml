Identifier: eos8gop
Slug: monroe-embeddings
Status: Ready
Title: Monroe Molecular Embeddings
Description: Turns a SMILES string into a 720-dimensional embedding for the 
  data-limited bioactivity modelling Monroe was built for. A graph transformer 
  pretrained on 81 million PM6 molecules and 1,089 PubChem bioassays, it adds 
  auxiliary edges encoding E/Z and R/S configuration so stereoisomers cannot 
  collapse to identical inputs. Only the encoder is served; the authors 
  in-context TabPFN head, which carries much of their reported accuracy, needs a
  labelled support set per task. Conformer generation is seeded for 
  reproducibility.
