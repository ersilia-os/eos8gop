Identifier: eos8gop
Slug: monroe-embeddings
Status: In progress
Title: Monroe Molecular Embeddings
Description: Turns a SMILES string into a 720-dimensional embedding from Monroe,
  a graph transformer pretrained on 81 million PM6 molecules for
  quantum-chemical properties and 1.5 million PubChem BioAssay compounds, with
  auxiliary graph edges encoding E/Z and R/S configuration so that stereoisomers
  do not collapse to identical inputs. Only the encoder is served here; the
  in-context TabPFN head the authors pair it with needs a labelled support set
  per task. Embeddings derive from an RDKit conformer, seeded for
  reproducibility.
